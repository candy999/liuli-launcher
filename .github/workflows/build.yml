name: 編譯 APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 專案沒有附 gradlew，直接用指定版本的 Gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 還原簽章金鑰
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "LIULI_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      # 正式版：版本號取自 tag（v1.0.0 → 1.0.0）
      - name: 決定版本號
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "LIULI_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "APK_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APK_VERSION=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: 編譯
        env:
          LIULI_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LIULI_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LIULI_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 命名 APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/LiuliLauncher-${APK_VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: LiuliLauncher-${{ env.APK_VERSION }}
          path: dist/*.apk

      # main 每次更新都覆蓋「nightly」預覽版，固定網址：
      # https://github.com/candy999/liuli-launcher/releases/download/nightly/LiuliLauncher-nightly.apk
      - name: 移動 nightly 標籤到最新版本
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp dist/*.apk dist/LiuliLauncher-nightly.apk
          git tag -f nightly
          git push -f origin nightly

      - name: 更新 nightly 預覽版
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: 預覽版（main 最新建置）
          prerelease: true
          body: |
            main 分支最新的自動建置（0.1.${{ github.run_number }}，${{ github.sha }}）。尚未經過完整測試。
            固定下載網址：https://github.com/candy999/liuli-launcher/releases/download/nightly/LiuliLauncher-nightly.apk
          files: dist/LiuliLauncher-nightly.apk

      # 推 v 開頭的 tag（例如 v1.0.0）時發布正式版：說明取自 docs/releases/<tag>.md
      - name: 發布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 琉璃 Launcher ${{ env.APK_VERSION }}
          body_path: docs/releases/${{ github.ref_name }}.md
          prerelease: false
          make_latest: true
          files: dist/*.apk
