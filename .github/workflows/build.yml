name: 編譯 APK

on:
  push:
    # android5：Android 5～7 專用版的分支（定案後不再加功能）
    branches: [main, android5]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 專案沒有附 gradlew，直接用指定版本的 Gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 還原簽章金鑰
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "LIULI_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      # 正式版：版本號取自 tag（v1.0.0 → 1.0.0）
      - name: 決定版本號
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "LIULI_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "APK_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APK_VERSION=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: 編譯
        env:
          LIULI_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LIULI_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LIULI_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease lintRelease --no-daemon --stacktrace

      - name: 相容性檢查的完整結果
        if: failure()
        run: cat app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt || true

      - name: 命名 APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/LiuliLauncher-${APK_VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: LiuliLauncher-${{ env.APK_VERSION }}
          path: dist/*.apk

      # main 每次更新都覆蓋「nightly」預覽版，固定網址：
      # https://github.com/candy999/liuli-launcher/releases/download/nightly/LiuliLauncher-nightly.apk
      - name: 移動 nightly 標籤到最新版本
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp dist/*.apk dist/LiuliLauncher-nightly.apk
          git tag -f nightly
          git push -f origin nightly

      - name: 更新 nightly 預覽版
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: 預覽版（main 最新建置）
          prerelease: true
          body: |
            main 分支最新的自動建置（0.1.${{ github.run_number }}，${{ github.sha }}）。尚未經過完整測試。
            固定下載網址：https://github.com/candy999/liuli-launcher/releases/download/nightly/LiuliLauncher-nightly.apk
          files: dist/LiuliLauncher-nightly.apk

      # 推 v 開頭的 tag（例如 v1.0.0）時發布正式版：說明取自 docs/releases/<tag>.md
      - name: 發布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 琉璃 Launcher ${{ env.APK_VERSION }}
          body_path: docs/releases/${{ github.ref_name }}.md
          prerelease: false
          make_latest: true
          files: dist/*.apk

      # android5 分支：覆蓋「Android 5～7 專用版」預覽版（不是正式版，軟體更新不會看到它），固定網址：
      # https://github.com/candy999/liuli-launcher/releases/download/legacy-android5/LiuliLauncher-android5.apk
      - name: 移動 Android 5 專用版標籤
        if: github.event_name == 'push' && github.ref == 'refs/heads/android5'
        run: |
          cp dist/*.apk dist/LiuliLauncher-android5.apk
          git tag -f legacy-android5
          git push -f origin refs/tags/legacy-android5

      - name: 更新 Android 5 專用版
        if: github.event_name == 'push' && github.ref == 'refs/heads/android5'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: legacy-android5
          name: Android 5～7 專用版
          prerelease: false
          make_latest: false
          body: |
            給 Android 5.0～7.1 電視盒的簡化版，以 1.2.3 為基礎（建置 ${{ github.run_number }}，${{ github.sha }}）。
            Android 8.0 以上請安裝正式版。

            和正式版的差別：
            - 背景只有純色、純黑，沒有背景模糊與細緻噪點
            - 沒有軟體更新（正式版要 Android 8.0 以上才裝得起來）
            - Android 5.0 沒有螢幕小時鐘（Android 5.1 以上有）

            實驗性修復：MStar 晶片的電視開機直接進琉璃、沒經過原廠桌面時，從琉璃打開的 App 播影片會和類比電視的雪花打架。
            現在從琉璃打開 App 前，會先把電視的訊號源切到多媒體（原廠桌面也是這樣做）。這是實驗性修復，如果反而有問題，請回報。

            固定下載網址：https://github.com/candy999/liuli-launcher/releases/download/legacy-android5/LiuliLauncher-android5.apk
          files: dist/LiuliLauncher-android5.apk
