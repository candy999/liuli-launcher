name: 編譯 APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 專案沒有附 gradlew，直接用指定版本的 Gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 同步桌布 SDK
        run: for d in app/src/main/assets/wallpapers/*/; do cp wallpaper-sdk/liuli.js "$d"; done

      - name: 還原簽章金鑰
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "LIULI_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: 編譯
        env:
          LIULI_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LIULI_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LIULI_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 命名 APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/LiuliLauncher-0.1.${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: LiuliLauncher-0.1.${{ github.run_number }}
          path: dist/*.apk

      # 推 v 開頭的 tag（例如 v0.1.0）時自動發布 Release，電視可直接用網址下載
      - name: 發布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
