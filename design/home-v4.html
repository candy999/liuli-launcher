<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>琉璃主畫面 v4 提案</title>
<style>
  /*
   * v4：背景是一層「跟著焦點活起來」的向量圖層。
   * - 色系：焦點項目的主題色（App 圖示色、訊號源、時鐘金、天氣藍）→ 整個背景平滑換色，飽和度有上限避免俗氣
   * - 樣式：每一種都有自己的「焦點反應」（光源移動、波峰移動、半色調聚光、方塊翻轉、漣漪…）
   * - 只在焦點改變後動約半秒，之後完全靜止（電視上才流暢）
   */
  :root {
    --ease: cubic-bezier(.2, .9, .25, 1.12);
    --ease-out: cubic-bezier(.2, .8, .2, 1);
    --gold: #ffd99a;
    --ink2: rgba(255,255,255,.74);
    --ink3: rgba(255,255,255,.52);
    --ink4: rgba(255,255,255,.32);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  #stage { width: 960px; height: 540px; position: relative; overflow: hidden; transform-origin: center; background: #05070f; }
  #wall { position: absolute; inset: 0; width: 100%; height: 100%; transition: filter 450ms var(--ease-out), transform 450ms var(--ease-out); }
  /* 子頁面：只模糊桌布，App 等主畫面內容直接淡出 */
  body.page-open #wall { filter: blur(26px) brightness(.62) saturate(1.25); transform: scale(1.08); }

  .glass {
    background: rgba(255,255,255,.08);
    backdrop-filter: blur(24px) saturate(1.7) brightness(1.04);
    -webkit-backdrop-filter: blur(24px) saturate(1.7) brightness(1.04);
    box-shadow:
      inset 0 1px .5px rgba(255,255,255,.55),
      inset 0 -1px .5px rgba(255,255,255,.16),
      inset 0 0 0 1px rgba(255,255,255,.09),
      inset 0 0 22px rgba(255,255,255,.05),
      0 18px 40px rgba(0,0,0,.28);
  }

  #home { position: absolute; inset: 0; transition: transform 420ms var(--ease-out), filter 420ms var(--ease-out), opacity 260ms; }
  body.drawer-open #home, body.sheet-open #home { transform: scale(.955); filter: blur(5px) brightness(.7); }
  body.page-open #home { opacity: 0; transform: scale(.97); }

  .focusable-group { position: absolute; border-radius: 28px; padding: 14px 20px; transition: transform 260ms var(--ease); }
  .focusable-group::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -1;
    opacity: 0; transform: scale(.94); transition: opacity 200ms, transform 260ms var(--ease);
    background: rgba(255,255,255,.10);
    backdrop-filter: blur(24px) saturate(1.7); -webkit-backdrop-filter: blur(24px) saturate(1.7);
    box-shadow: inset 0 1px .5px rgba(255,255,255,.6), inset 0 -1px .5px rgba(255,255,255,.16), inset 0 0 0 1px rgba(255,255,255,.1), 0 18px 40px rgba(0,0,0,.25);
  }
  .focusable-group.focus { transform: scale(1.03); }
  .focusable-group.focus::before { opacity: 1; transform: scale(1); }

  #today { left: 28px; top: 22px; }
  .time { font-size: 92px; font-weight: 200; line-height: .95; letter-spacing: -2px; text-shadow: 0 2px 24px rgba(0,0,0,.2); }
  .date { margin-top: 10px; font-size: 18px; color: var(--ink2); display: flex; align-items: center; gap: 12px; text-shadow: 0 1px 10px rgba(0,0,0,.25); }
  .date .dot { width: 3px; height: 3px; border-radius: 2px; background: var(--ink3); }
  .tag { display: inline-flex; align-items: center; gap: 6px; padding: 2px 11px; border-radius: 11px; background: rgba(255,200,120,.18); color: var(--gold); font-size: 14px; }
  .almanac { margin-top: 8px; font-size: 13px; color: var(--ink3); display: flex; gap: 18px; }
  .almanac b { font-weight: 400; color: var(--ink4); margin-right: 6px; }

  #weather { right: 92px; top: 30px; text-align: right; }
  .wx-top { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
  .wx-top svg { width: 34px; height: 34px; }
  .wx-temp { font-size: 52px; font-weight: 200; line-height: 1; }
  .wx-sub { margin-top: 6px; font-size: 15px; color: var(--ink2); }
  .wx-sub2 { margin-top: 2px; font-size: 13px; color: var(--ink3); }

  #gear { position: absolute; right: 30px; top: 40px; width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; transition: transform 260ms var(--ease), background 200ms; }
  #gear svg { width: 22px; height: 22px; opacity: .8; }
  #gear.focus { transform: scale(1.15); background: rgba(255,255,255,.95); box-shadow: 0 10px 28px rgba(0,0,0,.3); }
  #gear.focus svg { opacity: 1; stroke: #111; }

  #inputs { position: absolute; left: 48px; top: 232px; display: flex; align-items: center; gap: 12px; }
  #inputs .lbl { font-size: 13px; color: var(--ink3); margin-right: 4px; }
  .chip { height: 40px; padding: 0 16px 0 12px; border-radius: 20px; display: flex; align-items: center; gap: 8px; font-size: 15px; transition: transform 260ms var(--ease), background 150ms, color 150ms; }
  .chip svg { width: 20px; height: 20px; }
  .chip small { font-size: 12px; color: var(--ink3); }
  .chip.off { opacity: .5; }
  .chip.focus { transform: scale(1.1); background: rgba(255,255,255,.95); color: #111; box-shadow: 0 12px 28px rgba(0,0,0,.3); }
  .chip.focus svg { stroke: #111; }
  .chip.focus small { color: rgba(0,0,0,.55); }

  #dock-viewport { position: absolute; left: 0; right: 0; top: 284px; height: 150px; }
  #dock { position: absolute; left: 48px; top: 18px; display: flex; gap: 22px; align-items: center; transition: transform 380ms var(--ease-out); }
  .tile { position: relative; width: 150px; height: 84px; border-radius: 18px; flex: none; transition: transform 300ms var(--ease), box-shadow 300ms var(--ease); box-shadow: 0 8px 22px rgba(0,0,0,.25); }
  .tile .art { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; display: grid; place-items: center; font-weight: 800; font-size: 22px; letter-spacing: .3px; text-align: center; line-height: 1.1; padding: 0 8px; }
  .tile .art::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 1px 0 rgba(255,255,255,.28), inset 0 0 0 1px rgba(255,255,255,.08); }
  .tile .sheen { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity 250ms;
    background: linear-gradient(118deg, rgba(255,255,255,.34) 0%, rgba(255,255,255,.06) 32%, rgba(255,255,255,0) 46%); }
  .tile.focus { transform: scale(1.14) translateY(-4px); box-shadow: 0 22px 44px rgba(0,0,0,.5); z-index: 2; }
  .tile.focus .sheen { opacity: 1; }
  #focus-label { position: absolute; top: 128px; font-size: 16px; font-weight: 500; white-space: nowrap; transform: translateX(-50%);
    transition: left 300ms var(--ease-out), opacity 150ms; text-shadow: 0 1px 12px rgba(0,0,0,.35); }

  #drawer-hint { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font-size: 13px; color: var(--ink3); transition: opacity 200ms; }
  #drawer-hint svg { width: 18px; height: 18px; display: block; margin: 0 auto 2px; opacity: .7; }

  #drawer { position: absolute; left: 20px; right: 20px; bottom: 0; height: 440px; border-radius: 34px 34px 0 0; padding: 26px 28px 0;
    transform: translateY(105%); transition: transform 460ms var(--ease-out); }
  body.drawer-open #drawer { transform: translateY(0); }
  #drawer h2 { margin: 0; font-size: 22px; font-weight: 500; display: flex; align-items: baseline; gap: 12px; }
  #drawer h2 small { font-size: 13px; color: var(--ink3); font-weight: 400; }
  #drawer h2 .right { margin-left: auto; font-size: 12px; color: var(--ink4); }
  #grid-viewport { position: absolute; left: 28px; right: 28px; top: 74px; bottom: 0; overflow: hidden; }
  #grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 26px 22px; padding: 10px 8px 40px; transition: transform 380ms var(--ease-out); }
  #grid .tile { width: 100%; height: auto; aspect-ratio: 16/9; }
  #grid .tile .art { font-size: 15px; }
  #grid .cell .name { margin-top: 8px; font-size: 13px; text-align: center; color: var(--ink3); }
  #grid .cell.focus .name { color: #fff; font-weight: 500; }
  .badge { position: absolute; top: 6px; right: 6px; font-size: 10px; padding: 1px 6px; border-radius: 6px; background: rgba(0,0,0,.45); color: var(--ink2); }

  #sheet { position: absolute; top: 18px; bottom: 18px; right: 18px; width: 330px; border-radius: 30px; padding: 26px 16px;
    transform: translateX(110%); transition: transform 420ms var(--ease-out); }
  body.sheet-open #sheet { transform: translateX(0); }
  #sheet h3 { margin: 0 12px 4px; font-size: 21px; font-weight: 500; }
  #sheet p { margin: 0 12px 14px; font-size: 13px; color: var(--ink3); line-height: 1.5; }
  #sheet-items { position: absolute; left: 16px; right: 16px; top: 98px; bottom: 16px; overflow: hidden; }
  #sheet-list { transition: transform 300ms var(--ease-out); }
  .item { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; font-size: 16px; margin-bottom: 3px; }
  .item small { margin-left: auto; color: var(--ink3); font-size: 13px; }
  .item .mark { width: 6px; height: 6px; border-radius: 3px; background: var(--gold); }
  .item.focus { background: rgba(255,255,255,.94); color: #111; }
  .item.focus small { color: rgba(0,0,0,.55); }
  .item.focus .mark { background: #111; }
  #scrim { position: absolute; inset: 0; background: rgba(0,0,0,.22); opacity: 0; pointer-events: none; transition: opacity 300ms; }
  body.sheet-open #scrim { opacity: 1; }

  .page { position: absolute; inset: 0; padding: 36px 48px; opacity: 0; pointer-events: none; transform: scale(1.03); transition: opacity 280ms, transform 380ms var(--ease-out); }
  .page.show { opacity: 1; transform: scale(1); }
  .page .back { position: absolute; left: 48px; bottom: 22px; font-size: 12px; color: var(--ink4); }

  #calendar { display: grid; grid-template-columns: 1.55fr 1fr; gap: 44px; }
  .cal-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 14px; }
  .cal-head h1 { margin: 0; font-size: 34px; font-weight: 300; }
  .cal-head span { font-size: 14px; color: var(--ink3); }
  .weekdays, .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .weekdays div { text-align: center; font-size: 12px; color: var(--ink3); padding-bottom: 6px; }
  .days.from-down { animation: fromDown 380ms var(--ease-out); }
  .days.from-up { animation: fromUp 380ms var(--ease-out); }
  @keyframes fromDown { from { opacity: 0; transform: translateY(26px); } }
  @keyframes fromUp { from { opacity: 0; transform: translateY(-26px); } }
  .day { height: 56px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: transform 220ms var(--ease), background 150ms; }
  .day .n { font-size: 20px; }
  .day .l { font-size: 11px; color: var(--ink3); display: flex; align-items: center; gap: 3px; white-space: nowrap; }
  .day.special .l { color: var(--gold); }
  .day.bai .l::before { content: ""; width: 4px; height: 4px; border-radius: 2px; background: var(--gold); }
  .day.weekend .n { color: var(--ink2); }
  .day.today { box-shadow: inset 0 0 0 1.5px var(--gold); }
  .day.focus { background: rgba(255,255,255,.94); transform: scale(1.08); color: #111; }
  .day.focus .n, .day.focus .l { color: #111; }
  .day.focus.bai .l::before { background: #111; }
  .day.empty { visibility: hidden; }
  .detail .big { font-size: 76px; font-weight: 200; line-height: 1; }
  .detail .sub { font-size: 15px; color: var(--ink2); margin-top: 6px; }
  .detail h2 { font-size: 22px; font-weight: 500; margin: 20px 0 2px; }
  .detail .tags { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; min-height: 24px; }
  .detail dl { margin: 22px 0 0; display: grid; grid-template-columns: 64px 1fr; gap: 10px 8px; font-size: 15px; }
  .detail dt { color: var(--ink3); font-size: 13px; padding-top: 2px; }
  .detail dd { margin: 0; line-height: 1.55; word-break: keep-all; }
  .detail .note { margin-top: 18px; font-size: 11px; color: var(--ink4); }

  #weatherPage .now { display: flex; align-items: center; gap: 22px; }
  #weatherPage .now svg { width: 70px; height: 70px; }
  #weatherPage .now .t { font-size: 110px; font-weight: 100; line-height: 1; }
  #weatherPage .now .d { font-size: 26px; font-weight: 500; }
  #weatherPage .now .r { font-size: 15px; color: var(--ink2); margin-top: 4px; }
  .city { font-size: 18px; color: var(--ink2); }
  .stats { display: flex; gap: 34px; margin-top: 18px; }
  .stats div small { display: block; font-size: 12px; color: var(--ink3); }
  .stats div { font-size: 17px; }
  .hours { display: flex; justify-content: space-between; margin-top: 30px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.14); width: 520px; }
  .hours div { text-align: center; font-size: 15px; }
  .hours small { display: block; font-size: 12px; color: var(--ink3); margin-bottom: 6px; }
  .hours svg { width: 24px; height: 24px; display: block; margin: 0 auto 6px; }
  .week { position: absolute; right: 48px; top: 40px; width: 330px; }
  .week h3 { margin: 0 0 8px; font-size: 13px; font-weight: 400; color: var(--ink3); }
  .wrow { display: grid; grid-template-columns: 44px 28px 40px 34px 1fr 34px; align-items: center; gap: 6px; height: 50px; border-top: 1px solid rgba(255,255,255,.1); font-size: 15px; }
  .wrow svg { width: 22px; height: 22px; }
  .wrow .pop { font-size: 12px; color: #9fd4ff; }
  .wrow .lo { color: var(--ink3); text-align: right; }
  .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.14); position: relative; }
  .bar i { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, #8fd3ff, #ffd27a); }

  #toast { position: absolute; left: 50%; bottom: 46px; transform: translate(-50%, 20px); padding: 10px 20px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity 200ms, transform 300ms var(--ease-out); pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  #help { position: fixed; left: 10px; bottom: 6px; font: 12px system-ui; color: #888; }
  #help kbd { background: #222; border: 1px solid #444; border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: #ddd; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="wall"></canvas>

  <div id="home">
    <div id="today" class="focusable-group">
      <div class="time" id="clock"></div>
      <div class="date"><span id="solarDate"></span><span class="dot"></span><span id="lunarDate"></span><span id="lunarTag"></span></div>
      <div class="almanac"><span><b>宜</b><span id="yi"></span></span><span><b>忌</b><span id="ji"></span></span></div>
    </div>

    <div id="weather" class="focusable-group">
      <div class="wx-top">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"><path d="M20.5 13.2A8.5 8.5 0 1 1 10.8 3.5a6.6 6.6 0 0 0 9.7 9.7z"/></svg>
        <div class="wx-temp">23°</div>
      </div>
      <div class="wx-sub" id="wxCity">晴・新竹市</div>
      <div class="wx-sub2">28° / 21°　降雨 0%</div>
    </div>

    <div id="gear">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </div>

    <div id="inputs"><span class="lbl">訊號源</span></div>

    <div id="dock-viewport">
      <div id="dock"></div>
      <div id="focus-label"></div>
    </div>

    <div id="drawer-hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14l6-6 6 6"/></svg>
      所有 App
    </div>
  </div>

  <div id="drawer" class="glass">
    <h2>所有 App <small id="appCount"></small><span class="right">長按 Enter：更多選項　Esc：收合</span></h2>
    <div id="grid-viewport"><div id="grid"></div></div>
  </div>

  <div id="calendar" class="page"></div>
  <div id="weatherPage" class="page"></div>

  <div id="scrim"></div>
  <div id="sheet" class="glass">
    <h3 id="sheetTitle"></h3>
    <p id="sheetSub"></p>
    <div id="sheet-items"><div id="sheet-list"></div></div>
  </div>

  <div id="toast" class="glass"></div>
</div>
<div id="help"><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 移動　<kbd>Enter</kbd> 選擇（按住＝更多選項）　<kbd>Esc</kbd> 返回　<kbd>1</kbd>～<kbd>0</kbd> 快速切換背景樣式　<kbd>C</kbd> 色彩跟隨開關</div>

<script>
var $ = function (id) { return document.getElementById(id); };
var stageScale = 1;

/* ═══════════════════════════ 背景引擎 ═══════════════════════════
 * 以 480×270 繪製再放大（柔和圖形看不出差別，成本只有 1/4）。
 * 目標色與焦點位置改變時，用彈性插值追上；追上後停止繪製（畫面靜止＝零成本）。
 */
var BG = (function () {
  var cv = $('wall'), g = cv.getContext('2d'), W = 480, H = 270, SK = 1;
  // 全解析度：畫布像素＝實際顯示大小 × 螢幕像素密度；繪圖仍用 480×270 的邏輯座標，靠 transform 放大，向量邊緣保持銳利
  function resize(cssW, cssH) {
    var dpr = window.devicePixelRatio || 1, pw = Math.max(1, Math.round(cssW * dpr)), ph = Math.max(1, Math.round(cssH * dpr));
    if (cv.width === pw && cv.height === ph) return false;
    cv.width = pw; cv.height = ph; SK = pw / W; grain = makeGrain(pw, ph); return true;
  }
  var cur = { h: 228, s: .5, fx: .2, fy: .7, ripple: 0 };
  var tgt = { h: 228, s: .5, fx: .2, fy: .7 };
  var pulse = 0, dir = 0, running = false, style = 'waves', follow = true;

  function rnd(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function hexToHs(hex) {
    var n = parseInt(hex.slice(1), 16), r = (n >> 16) / 255, gg = (n >> 8 & 255) / 255, b = (n & 255) / 255;
    var mx = Math.max(r, gg, b), mn = Math.min(r, gg, b), d = mx - mn, h = 0, l = (mx + mn) / 2;
    var s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
    if (d) { if (mx === r) h = ((gg - b) / d) % 6; else if (mx === gg) h = (b - r) / d + 2; else h = (r - gg) / d + 4; }
    h = (h * 60 + 360) % 360;
    // 黃色在深色背景上會變成橄欖褐（很髒），往琥珀色偏移
    if (h >= 40 && h <= 78) h = 34 + (h - 40) * .25;
    return [h, s];
  }
  // 顏色：以目前色相為中心；飽和度有上限，背景永遠是「暗、同色系」，不會俗豔
  function C(hOff, s, l, a) { return 'hsla(' + ((cur.h + hOff + 360) % 360).toFixed(1) + ',' + (Math.min(1, s * cur.s * 1.6) * 100).toFixed(1) + '%,' + (l * 100).toFixed(1) + '%,' + (a == null ? 1 : a) + ')'; }

  function base() {
    var gr = g.createLinearGradient(0, 0, W * .25, H);
    gr.addColorStop(0, C(-8, .7, .06)); gr.addColorStop(1, C(14, .8, .15));
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
  }
  function vignette(a) {

    return { label: BG.styles[k].name, detail: BG.styles[k].note, sel: k === before, preview: function () { BG.setStyle(k); }, go: function () { BG.setStyle(k); closeAll(); toast('背景：' + BG.styles[k].name); } };
  }), onCancel: function () { BG.setStyle(before); } });
}
function settingsSheet() {
  openSheet({ title: '設定', items: [
    { label: '地點', detail: city, go: citySheet },
    { label: '背景樣式', detail: BG.styles[BG.style].name, go: styleSheet },
    { label: '背景色系', detail: BG.follow ? '跟隨焦點' : '固定深藍', go: function () { BG.setFollow(!BG.follow); closeAll(); toast('背景色系：' + (BG.follow ? '跟隨焦點' : '固定深藍')); } },
    { label: '顯示／隱藏 App', go: function () { toast('（原型）逐一切換顯示'); } },
    { label: '遙控器按鍵', detail: '改綁、防誤入原廠', go: function () { toast('（原型）按鍵對應'); } },
    { label: '系統設定', go: function () { toast('開啟系統設定'); } }
  ] });
}
function citySheet() {
  openSheet({ title: '地點', sub: '天氣用。只用縣市中心的大約位置，不讀取裝置定位。', focus: CITIES.indexOf(city), items: CITIES.map(function (c) {
    return { label: c, sel: c === city, go: function () { city = c; $('wxCity').textContent = '晴・' + c; $('wxPageCity').textContent = c; closeAll(); toast('地點已改為 ' + c); } };
  }) });
}
function appOptions(app, inDock) {
  openSheet({ title: app.n, sub: app.phone ? '手機版 App：可能需要滑鼠或觸控操作' : null, items: [
    { label: '開啟', go: function () { closeAll(); toast('開啟 ' + app.n); } },
    inDock ? { label: '移動位置', detail: '左右鍵移動', go: function () { closeAll(); toast('（原型）進入移動模式'); } } : { label: '加入常用', go: function () { closeAll(); toast('已加入常用'); } },
    inDock ? { label: '從常用移除', go: function () { closeAll(); toast('已從常用移除'); } } : { label: '從主畫面隱藏', go: function () { closeAll(); toast('已隱藏'); } },
    { label: '應用程式資訊', detail: '強制停止、清除快取', go: function () { closeAll(); toast('開啟 App 資訊'); } },
    { label: '解除安裝', go: function () { closeAll(); toast('開啟解除安裝'); } }
  ] });
}

/* ── 月曆：上下左右越過邊界就自動翻月 ── */
var calShownMonth = null, calAnim = '';
function renderCalendar() {
  var sel = S.sel, y = sel.getFullYear(), m = sel.getMonth(), today = new Date();
  var key = y + '-' + m;
  if (calShownMonth && calShownMonth !== key) calAnim = (calShownMonth < key || (calShownMonth.length < key.length)) ? 'from-down' : 'from-up';
  else calAnim = '';
  if (calShownMonth && calShownMonth !== key) { var a = calShownMonth.split('-'), before = a[0] * 12 + +a[1], after = y * 12 + m; calAnim = after > before ? 'from-down' : 'from-up'; }
  calShownMonth = key;
  var first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate(), cells = '';
  for (var i = 0; i < first; i++) cells += '<div class="day empty"></div>';
  var firstL = null, lastL = null;
  for (var d = 1; d <= days; d++) {
    var dt = new Date(y, m, d), inf = dayInfo(dt), wd = dt.getDay();
    if (d === 1) firstL = inf.l; if (d === days) lastL = inf.l;
    var isToday = dt.toDateString() === today.toDateString();
    cells += '<div class="day' + (wd === 0 || wd === 6 ? ' weekend' : '') + (isToday ? ' today' : '') + (inf.special ? ' special' : '') + (inf.bai ? ' bai' : '') + (d === sel.getDate() ? ' focus' : '') + '"><div class="n">' + d + '</div><div class="l">' + inf.label + '</div></div>';
  }
  var si = dayInfo(sel), yj = yiji(sel), isT = sel.toDateString() === today.toDateString();
  var tags = (isT ? '<span class="tag">今天</span>' : '') + si.fest.map(function (f) { return '<span class="tag">' + f + '</span>'; }).join('') + (si.term ? '<span class="tag">' + si.term + '</span>' : '') + (si.bai ? '<span class="tag">' + si.l.dayText + '拜拜</span>' : '');
  $('calendar').innerHTML =
    '<div><div class="cal-head"><h1>' + y + '年' + (m + 1) + '月</h1><span>農曆' + firstL.monthText + firstL.dayText + ' － ' + lastL.monthText + lastL.dayText + '・' + firstL.year + firstL.zodiac + '年</span></div>' +
    '<div class="weekdays">' + '日一二三四五六'.split('').map(function (w) { return '<div>' + w + '</div>'; }).join('') + '</div>' +
    '<div class="days ' + calAnim + '">' + cells + '</div></div>' +
    '<div class="detail"><div class="big">' + sel.getDate() + '</div><div class="sub">' + y + '年' + (m + 1) + '月 星期' + '日一二三四五六'.charAt(sel.getDay()) + '</div>' +
    '<h2>農曆' + si.l.monthText + si.l.dayText + '</h2><div class="sub" style="color:var(--ink3)">' + si.l.year + '年・生肖' + si.l.zodiac + '</div><div class="tags">' + tags + '</div>' +
    '<dl><dt>宜</dt><dd>' + yj.yi.join('　') + '</dd><dt>忌</dt><dd>' + yj.ji.join('　') + '</dd></dl>' +
    '<div class="note">農曆日期為真實資料；宜忌在原型中為示意</div></div>' +
    '<div class="back">↑↓←→ 選日期，越過邊界自動翻月　Esc 返回</div>';
}

/* ── 天氣頁 ── */
(function () {
  var hours = [['現在', 'moon', 23], ['22時', 'moon', 22], ['1時', 'cloud', 21], ['4時', 'cloud', 21], ['7時', 'sun', 22], ['10時', 'sun', 26], ['13時', 'sun', 28], ['16時', 'cloud', 26]];
  var days = [['今天', 'sun', 0, 21, 28], ['一', 'cloud', 10, 20, 24], ['二', 'rain', 60, 19, 21], ['三', 'rain', 40, 18, 22], ['四', 'cloud', 10, 19, 23], ['五', 'sun', 0, 20, 26], ['六', 'sun', 0, 21, 27]];
  $('weatherPage').innerHTML =
    '<div class="city" id="wxPageCity">新竹市</div>' +
    '<div class="now">' + ICON.moon + '<div class="t">23°</div><div><div class="d">晴</div><div class="r">最高 28°　最低 21°</div></div></div>' +
    '<div class="stats"><div><small>體感</small>24°</div><div><small>濕度</small>68%</div><div><small>風速</small>9 km/h</div><div><small>降雨機率</small>0%</div><div><small>日出</small>06:09</div><div><small>日落</small>17:08</div></div>' +
    '<div class="hours">' + hours.map(function (h) { return '<div><small>' + h[0] + '</small>' + ICON[h[1]] + h[2] + '°</div>'; }).join('') + '</div>' +
    '<div class="week"><h3>7 日預報</h3>' + days.map(function (d) {
      var l = (d[3] - 18) / 10 * 100, r = (d[4] - 18) / 10 * 100;
      return '<div class="wrow"><span>' + d[0] + '</span>' + ICON[d[1]] + '<span class="pop">' + (d[2] >= 20 ? d[2] + '%' : '') + '</span><span class="lo">' + d[3] + '°</span><div class="bar"><i style="left:' + l + '%;right:' + (100 - r) + '%"></i></div><span>' + d[4] + '°</span></div>';
    }).join('') + '</div><div class="back">Esc 返回</div>';
})();

var toastTimer;
function toast(msg) { var t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1600); }

/* ═══════════════════════════ 按鍵 ═══════════════════════════ */
function activate(long) {
  if (S.layer === 'home' && S.zone === 'top') {
    if (S.top === 0) { var n = new Date(); S.sel = new Date(n.getFullYear(), n.getMonth(), n.getDate()); calShownMonth = null; S.layer = 'calendar'; render(); }
    else if (S.top === 1) { S.layer = 'weather'; render(); }
    else settingsSheet();
  } else if (S.layer === 'home' && S.zone === 'inputs') {
    var inp = inputEls[S.inp].input; toast(inp.sub === '未連接' ? inp.n + ' 沒有連接裝置' : '切換到 ' + inp.n + '（' + inp.sub + '）');
  } else if (S.layer === 'home' && S.zone === 'dock') {
    var it = dockItems[S.dock]; if (long) appOptions(it.app, true); else toast('開啟 ' + it.app.n);
  } else if (S.layer === 'drawer') {
    var c = gridCells[S.grid]; if (long) appOptions(c.app, FAVS.indexOf(c.idx) >= 0); else toast('開啟 ' + c.app.n);
  } else if (S.layer === 'sheet') S.sheet.items[S.sheetIdx].go();
}
function back() {
  if (S.layer === 'sheet') { if (!S.sheetStack.length && S.sheet.onCancel) S.sheet.onCancel(); else if (S.sheet.onCancel) S.sheet.onCancel(); closeSheet(); }
  else if (S.layer === 'drawer' || S.layer === 'calendar' || S.layer === 'weather') { S.layer = 'home'; render(); }
  else if (S.layer === 'home') { S.zone = 'dock'; S.dock = 0; render(); }
}
function move(dx, dy) {
  S.lastDir = dx || 0;
  if (S.layer === 'home') {
    if (S.zone === 'top') { if (dx) S.top = Math.max(0, Math.min(2, S.top + dx)); if (dy > 0) S.zone = 'inputs'; }
    else if (S.zone === 'inputs') { if (dx) S.inp = Math.max(0, Math.min(inputEls.length - 1, S.inp + dx)); if (dy < 0) { S.zone = 'top'; S.top = 0; } if (dy > 0) S.zone = 'dock'; }
    else { if (dx) S.dock = Math.max(0, Math.min(dockItems.length - 1, S.dock + dx)); if (dy < 0) S.zone = 'inputs'; if (dy > 0) S.layer = 'drawer'; }
  } else if (S.layer === 'drawer') {
    var n = gridCells.length;
    if (dx) { var nx = S.grid + dx; if (Math.floor(nx / 6) === Math.floor(S.grid / 6) && nx >= 0 && nx < n) S.grid = nx; }
    if (dy > 0) { if (S.grid + 6 < n) S.grid += 6; else if (Math.floor(S.grid / 6) < Math.floor((n - 1) / 6)) S.grid = n - 1; }
    if (dy < 0) { if (S.grid < 6) S.layer = 'home'; else S.grid -= 6; }
  } else if (S.layer === 'sheet') {
    if (dy) S.sheetIdx = Math.max(0, Math.min(S.sheet.items.length - 1, S.sheetIdx + dy));
    if (dx < 0) { if (S.sheet.onCancel) S.sheet.onCancel(); closeSheet(); return; }
  } else if (S.layer === 'calendar') {
    // 日期直接加減：越過月初／月底自然進到上下個月
    S.sel = new Date(S.sel.getFullYear(), S.sel.getMonth(), S.sel.getDate() + dx + dy * 7);
  }
  render();
}

var holdTimer = null, longFired = false, keys = Object.keys(BG.styles);
addEventListener('keydown', function (e) {
  var k = e.key;
  if (k === 'ArrowLeft') move(-1, 0);
  else if (k === 'ArrowRight') move(1, 0);
  else if (k === 'ArrowUp') move(0, -1);
  else if (k === 'ArrowDown') move(0, 1);
  else if (k === 'Escape' || k === 'Backspace') back();
  else if (k === 'Enter') { if (!e.repeat) { longFired = false; holdTimer = setTimeout(function () { longFired = true; activate(true); }, 500); } }
  else if (/^[0-9]$/.test(k)) { var idx = (parseInt(k, 10) + 9) % 10; if (keys[idx]) { BG.setStyle(keys[idx]); toast('背景：' + BG.styles[keys[idx]].name); } }
  else if (k === '-') { BG.setStyle(keys[10]); toast('背景：' + BG.styles[keys[10]].name); }
  else if (k === '=') { BG.setStyle(keys[11]); toast('背景：' + BG.styles[keys[11]].name); }
  else if (k === 'c' || k === 'C') { BG.setFollow(!BG.follow); toast('背景色系：' + (BG.follow ? '跟隨焦點' : '固定深藍')); }
  else return;
  e.preventDefault();
});
addEventListener('keyup', function (e) { if (e.key === 'Enter') { clearTimeout(holdTimer); if (!longFired) activate(false); } });

function fit() {
  stageScale = Math.min(innerWidth / 960, (innerHeight - 24) / 540);
  $('stage').style.transform = 'scale(' + stageScale + ')';
  BG.resize(960 * stageScale, 540 * stageScale);
}
addEventListener('resize', fit); fit();
render();
// 網址參數：#style=flip&focus=2 直接開啟某個樣式、移到某個 App（方便比較與截圖）
(function () {
  var q = {}; location.hash.slice(1).split('&').forEach(function (kv) { var a = kv.split('='); if (a[0]) q[a[0]] = decodeURIComponent(a[1] || ''); });
  if (q.style && BG.styles[q.style]) BG.setStyle(q.style);
  if (q.focus) setTimeout(function () { var n = +q.focus; for (var i = 0; i < n; i++) move(1, 0); }, 300);
})();
</script>
