<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>琉璃主畫面 v3 原型</title>
<style>
  /*
   * 設計座標 960×540 dp（＝1080p 電視），整個舞台等比縮放。
   * 原則：內容直接放在桌布上；玻璃只出現在「浮起來的東西」——焦點膠囊、抽屜、側邊面板。
   */
  :root {
    --ease: cubic-bezier(.2, .9, .25, 1.12);   /* 帶一點回彈的彈簧感 */
    --ease-out: cubic-bezier(.2, .8, .2, 1);
    --gold: #ffd99a;
    --ink2: rgba(255,255,255,.72);
    --ink3: rgba(255,255,255,.50);
    --ink4: rgba(255,255,255,.30);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  #stage { width: 960px; height: 540px; position: relative; overflow: hidden; transform-origin: center; }
  #wall { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* ── 玻璃材質（只給浮起來的東西用） ── */
  .glass {
    background: rgba(255,255,255,.08);
    backdrop-filter: blur(24px) saturate(1.7) brightness(1.04);
    -webkit-backdrop-filter: blur(24px) saturate(1.7) brightness(1.04);
    box-shadow:
      inset 0 1px .5px rgba(255,255,255,.55),
      inset 0 -1px .5px rgba(255,255,255,.16),
      inset 0 0 0 1px rgba(255,255,255,.09),
      inset 0 0 22px rgba(255,255,255,.05),
      0 18px 40px rgba(0,0,0,.28);
  }

  #home { position: absolute; inset: 0; transition: transform 420ms var(--ease-out), filter 420ms var(--ease-out), opacity 300ms; }
  body.drawer-open #home, body.sheet-open #home { transform: scale(.955); filter: blur(5px) brightness(.7); }
  /* 子頁面：主畫面退到很深的模糊背景，避免 App 色塊干擾閱讀 */
  body.page-open #home { transform: scale(.94); filter: blur(26px) brightness(.45) saturate(.8); }

  /* ── 頂部：時間＋農曆＋天氣，直接放在桌布上 ── */
  .focusable-group { position: absolute; border-radius: 28px; padding: 14px 20px; transition: transform 260ms var(--ease); }
  .focusable-group::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -1;
    opacity: 0; transform: scale(.94); transition: opacity 200ms, transform 260ms var(--ease);
    background: rgba(255,255,255,.10);
    backdrop-filter: blur(24px) saturate(1.7); -webkit-backdrop-filter: blur(24px) saturate(1.7);
    box-shadow: inset 0 1px .5px rgba(255,255,255,.6), inset 0 -1px .5px rgba(255,255,255,.16), inset 0 0 0 1px rgba(255,255,255,.1), 0 18px 40px rgba(0,0,0,.25);
  }
  .focusable-group.focus { transform: scale(1.03); }
  .focusable-group.focus::before { opacity: 1; transform: scale(1); }

  #today { left: 28px; top: 22px; }
  .time { font-size: 92px; font-weight: 200; line-height: .95; letter-spacing: -2px; text-shadow: 0 2px 24px rgba(0,0,0,.18); }
  .date { margin-top: 10px; font-size: 18px; color: var(--ink2); display: flex; align-items: center; gap: 12px; }
  .date .dot { width: 3px; height: 3px; border-radius: 2px; background: var(--ink3); }
  .tag { display: inline-flex; align-items: center; gap: 6px; padding: 2px 11px; border-radius: 11px; background: rgba(255,200,120,.16); color: var(--gold); font-size: 14px; }
  .almanac { margin-top: 8px; font-size: 13px; color: var(--ink3); display: flex; gap: 18px; }
  .almanac b { font-weight: 400; color: var(--ink4); margin-right: 6px; }
  .more { margin-top: 6px; font-size: 12px; color: var(--ink4); height: 0; opacity: 0; transition: opacity 200ms; }
  .focus .more { opacity: 1; }

  #weather { right: 92px; top: 30px; text-align: right; }
  .wx-top { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
  .wx-top svg { width: 34px; height: 34px; }
  .wx-temp { font-size: 52px; font-weight: 200; line-height: 1; }
  .wx-sub { margin-top: 6px; font-size: 15px; color: var(--ink2); }
  .wx-sub2 { margin-top: 2px; font-size: 13px; color: var(--ink3); }

  #gear { position: absolute; right: 30px; top: 40px; width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; transition: transform 260ms var(--ease), background 200ms; }
  #gear svg { width: 22px; height: 22px; opacity: .8; }
  #gear.focus { transform: scale(1.15); background: rgba(255,255,255,.95); box-shadow: 0 10px 28px rgba(0,0,0,.3); }
  #gear.focus svg { opacity: 1; stroke: #111; }

  /* ── 常用列：App 直接放在桌布上；訊號源接在後面 ── */
  #inputs { position: absolute; left: 48px; top: 232px; display: flex; align-items: center; gap: 12px; }
  #inputs .lbl { font-size: 13px; color: var(--ink3); margin-right: 4px; }
  .chip { height: 40px; padding: 0 16px 0 12px; border-radius: 20px; display: flex; align-items: center; gap: 8px; font-size: 15px; transition: transform 260ms var(--ease), background 150ms, color 150ms; }
  .chip svg { width: 20px; height: 20px; }
  .chip small { font-size: 12px; color: var(--ink3); }
  .chip.off { opacity: .5; }
  .chip.focus { transform: scale(1.1); background: rgba(255,255,255,.95); color: #111; box-shadow: 0 12px 28px rgba(0,0,0,.3); }
  .chip.focus svg { stroke: #111; }
  .chip.focus small { color: rgba(0,0,0,.55); }
  #dock-viewport { position: absolute; left: 0; right: 0; top: 284px; height: 150px; overflow: visible; }
  #dock { position: absolute; left: 48px; top: 18px; display: flex; gap: 22px; align-items: center; transition: transform 380ms var(--ease-out); }
  .tile { position: relative; width: 150px; height: 84px; border-radius: 18px; flex: none; transition: transform 300ms var(--ease), box-shadow 300ms var(--ease); box-shadow: 0 8px 22px rgba(0,0,0,.25); }
  .tile .art { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; display: grid; place-items: center; font-weight: 800; font-size: 23px; letter-spacing: .3px; }
  .tile .art::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 1px 0 rgba(255,255,255,.28), inset 0 0 0 1px rgba(255,255,255,.08); }
  .tile .sheen { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity 250ms;
    background: linear-gradient(118deg, rgba(255,255,255,.34) 0%, rgba(255,255,255,.06) 32%, rgba(255,255,255,0) 46%); }
  .tile.focus { transform: scale(1.14) translateY(-4px); box-shadow: 0 22px 44px rgba(0,0,0,.5); z-index: 2; }
  .tile.focus .sheen { opacity: 1; }
  .tile.input .art { flex-direction: column; gap: 4px; font-weight: 500; font-size: 15px; }
  .tile.input .art svg { width: 26px; height: 26px; }
  .tile.input .art small { font-size: 11px; color: var(--ink3); font-weight: 400; }
  .tile.input.focus .art { background: rgba(255,255,255,.94); color: #111; }
  .tile.input.focus .art svg { stroke: #111; }
  .tile.input.focus .art small { color: rgba(0,0,0,.55); }
  .divider { width: 1px; height: 54px; background: rgba(255,255,255,.22); flex: none; margin: 0 4px; }
  .group-label { position: absolute; top: -22px; font-size: 13px; color: var(--ink3); white-space: nowrap; }

  #focus-label { position: absolute; top: 128px; font-size: 16px; font-weight: 500; text-align: center; white-space: nowrap; transform: translateX(-50%);
    transition: left 300ms var(--ease-out), opacity 150ms; text-shadow: 0 1px 12px rgba(0,0,0,.35); }

  #drawer-hint { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font-size: 13px; color: var(--ink3); transition: opacity 200ms; }
  #drawer-hint svg { width: 18px; height: 18px; display: block; margin: 0 auto 2px; opacity: .7; }

  /* ── 所有 App 抽屜 ── */
  #drawer { position: absolute; left: 20px; right: 20px; bottom: 0; height: 440px; border-radius: 34px 34px 0 0; padding: 26px 28px 0;
    transform: translateY(105%); transition: transform 460ms var(--ease-out); }
  body.drawer-open #drawer { transform: translateY(0); }
  #drawer h2 { margin: 0; font-size: 22px; font-weight: 500; display: flex; align-items: baseline; gap: 12px; }
  #drawer h2 small { font-size: 13px; color: var(--ink3); font-weight: 400; }
  #drawer h2 .right { margin-left: auto; font-size: 12px; color: var(--ink4); }
  #grid-viewport { position: absolute; left: 28px; right: 28px; top: 74px; bottom: 0; overflow: hidden; }
  #grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 26px 22px; padding: 10px 8px 40px; transition: transform 380ms var(--ease-out); }
  #grid .tile { width: 100%; height: auto; aspect-ratio: 16/9; }
  #grid .tile .art { font-size: 15px; padding: 0 8px; text-align: center; line-height: 1.15; }
  #grid .cell { position: relative; }
  #grid .cell .name { margin-top: 8px; font-size: 13px; text-align: center; color: var(--ink3); transition: color 150ms; }
  #grid .cell.focus .name { color: #fff; font-weight: 500; }
  .badge { position: absolute; top: 6px; right: 6px; font-size: 10px; padding: 1px 6px; border-radius: 6px; background: rgba(0,0,0,.45); color: var(--ink2); }

  /* ── 側邊面板 ── */
  #sheet { position: absolute; top: 18px; bottom: 18px; right: 18px; width: 330px; border-radius: 30px; padding: 26px 16px;
    transform: translateX(110%); transition: transform 420ms var(--ease-out); }
  body.sheet-open #sheet { transform: translateX(0); }
  #sheet h3 { margin: 0 12px 4px; font-size: 21px; font-weight: 500; }
  #sheet p { margin: 0 12px 14px; font-size: 13px; color: var(--ink3); line-height: 1.5; }
  #sheet-items { position: absolute; left: 16px; right: 16px; top: 98px; bottom: 16px; overflow: hidden; }
  #sheet-list { transition: transform 300ms var(--ease-out); }
  .item { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; font-size: 16px; margin-bottom: 3px; transition: background 150ms; }
  .item small { margin-left: auto; color: var(--ink3); font-size: 13px; }
  .item .mark { width: 6px; height: 6px; border-radius: 3px; background: var(--gold); }
  .item.focus { background: rgba(255,255,255,.94); color: #111; }
  .item.focus small { color: rgba(0,0,0,.55); }
  .item.focus .mark { background: #111; }
  #scrim { position: absolute; inset: 0; background: rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity 300ms; }
  body.sheet-open #scrim { opacity: 1; }

  /* ── 子頁面：月曆、天氣（模糊的主畫面當背景，內容不加框） ── */
  .page { position: absolute; inset: 0; padding: 36px 48px; opacity: 0; pointer-events: none; transform: scale(1.03); transition: opacity 280ms, transform 380ms var(--ease-out); }
  .page.show { opacity: 1; transform: scale(1); }
  .page .back { position: absolute; left: 48px; bottom: 22px; font-size: 12px; color: var(--ink4); }

  /* 月曆 */
  #calendar { display: grid; grid-template-columns: 1.55fr 1fr; gap: 44px; }
  .cal-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 14px; }
  .cal-head h1 { margin: 0; font-size: 34px; font-weight: 300; }
  .cal-head span { font-size: 14px; color: var(--ink3); }
  .cal-head .nav { margin-left: auto; font-size: 12px; color: var(--ink4); }
  .weekdays, .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .weekdays div { text-align: center; font-size: 12px; color: var(--ink3); padding-bottom: 6px; }
  .day { height: 60px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; transition: transform 220ms var(--ease), background 150ms; }
  .day .n { font-size: 20px; }
  .day .l { font-size: 11px; color: var(--ink3); display: flex; align-items: center; gap: 3px; }
  .day.special .l { color: var(--gold); }
  .day.bai .l::before { content: ""; width: 4px; height: 4px; border-radius: 2px; background: var(--gold); }
  .day.weekend .n { color: var(--ink2); }
  .day.today { box-shadow: inset 0 0 0 1.5px var(--gold); }
  .day.focus { background: rgba(255,255,255,.94); transform: scale(1.08); color: #111; }
  .day.focus .n, .day.focus .l { color: #111; }
  .day.focus.bai .l::before { background: #111; }
  .day.empty { visibility: hidden; }
  .detail .big { font-size: 76px; font-weight: 200; line-height: 1; }
  .detail .sub { font-size: 15px; color: var(--ink2); margin-top: 6px; }
  .detail h2 { font-size: 22px; font-weight: 500; margin: 20px 0 2px; }
  .detail .tags { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .detail dl { margin: 22px 0 0; display: grid; grid-template-columns: 64px 1fr; gap: 10px 8px; font-size: 15px; }
  .detail dt { color: var(--ink3); font-size: 13px; padding-top: 2px; }
  .detail dd { margin: 0; line-height: 1.55; word-break: keep-all; }

  /* 天氣 */
  #weatherPage .now { display: flex; align-items: center; gap: 22px; }
  #weatherPage .now svg { width: 70px; height: 70px; }
  #weatherPage .now .t { font-size: 110px; font-weight: 100; line-height: 1; }
  #weatherPage .now .d { font-size: 26px; font-weight: 500; }
  #weatherPage .now .r { font-size: 15px; color: var(--ink2); margin-top: 4px; }
  .city { font-size: 18px; color: var(--ink2); }
  .stats { display: flex; gap: 34px; margin-top: 18px; }
  .stats div small { display: block; font-size: 12px; color: var(--ink3); }
  .stats div { font-size: 17px; }
  .hours { display: flex; justify-content: space-between; margin-top: 30px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.12); width: 520px; }
  .hours div { text-align: center; font-size: 15px; }
  .hours small { display: block; font-size: 12px; color: var(--ink3); margin-bottom: 6px; }
  .hours svg { width: 24px; height: 24px; display: block; margin: 0 auto 6px; }
  .week { position: absolute; right: 48px; top: 40px; width: 330px; }
  .week h3 { margin: 0 0 8px; font-size: 13px; font-weight: 400; color: var(--ink3); }
  .wrow { display: grid; grid-template-columns: 44px 28px 40px 34px 1fr 34px; align-items: center; gap: 6px; height: 50px; border-top: 1px solid rgba(255,255,255,.08); font-size: 15px; }
  .wrow svg { width: 22px; height: 22px; }
  .wrow .pop { font-size: 12px; color: #9fd4ff; }
  .wrow .lo { color: var(--ink3); text-align: right; }
  .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); position: relative; }
  .bar i { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, #8fd3ff, #ffd27a); }

  #toast { position: absolute; left: 50%; bottom: 46px; transform: translate(-50%, 20px); padding: 10px 20px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity 200ms, transform 300ms var(--ease-out); pointer-events: none; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  #help { position: fixed; left: 10px; bottom: 8px; font: 12px system-ui; color: #888; }
  #help kbd { background: #222; border: 1px solid #444; border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: #ddd; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="wall" width="960" height="540"></canvas>

  <div id="home">
    <div id="today" class="focusable-group" data-zone="top" data-i="0">
      <div class="time" id="clock">19:12</div>
      <div class="date">11月8日 星期日 <span class="dot"></span> 農曆九月三十 <span class="tag">明天初一</span></div>
      <div class="almanac"><span><b>宜</b>安床 祭祀 開池</span><span><b>忌</b>入宅 移徙 嫁娶</span></div>
      <div class="more">按 Enter 開啟月曆與農民曆</div>
    </div>

    <div id="weather" class="focusable-group" data-zone="top" data-i="1">
      <div class="wx-top">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"><path d="M20.5 13.2A8.5 8.5 0 1 1 10.8 3.5a6.6 6.6 0 0 0 9.7 9.7z"/></svg>
        <div class="wx-temp">23°</div>
      </div>
      <div class="wx-sub" id="wxCity">晴・新竹市</div>
      <div class="wx-sub2">28° / 21°　降雨 0%</div>
    </div>

    <div id="gear" data-zone="top" data-i="2">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </div>

    <div id="inputs"><span class="lbl">訊號源</span></div>

    <div id="dock-viewport">
      <div id="dock"></div>
      <div id="focus-label"></div>
    </div>

    <div id="drawer-hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14l6-6 6 6"/></svg>
      所有 App
    </div>
  </div>

  <div id="drawer" class="glass">
    <h2>所有 App <small id="appCount"></small><span class="right">長按 Enter：更多選項　Esc：收合</span></h2>
    <div id="grid-viewport"><div id="grid"></div></div>
  </div>

  <div id="calendar" class="page"></div>
  <div id="weatherPage" class="page"></div>

  <div id="scrim"></div>
  <div id="sheet" class="glass">
    <h3 id="sheetTitle"></h3>
    <p id="sheetSub"></p>
    <div id="sheet-items"><div id="sheet-list"></div></div>
  </div>

  <div id="toast" class="glass"></div>
</div>
<div id="help"><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 移動　<kbd>Enter</kbd> 選擇（按住＝更多選項）　<kbd>Esc</kbd> 返回</div>

<script>
/* ════════════ 桌布：同色系、只畫一次 ════════════ */
(function () {
  var c = document.getElementById('wall').getContext('2d'), W = 960, H = 540;
  function rgba(hex, a) { var n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')'; }
  var g = c.createLinearGradient(0, 0, W * .3, H); g.addColorStop(0, '#060a1d'); g.addColorStop(1, '#0d1634');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  [['#2a4be0', .08, .15, .55, .5], ['#3b2fb5', .9, .1, .45, .42], ['#0e6f8c', .7, 1.0, .6, .5]].forEach(function (b) {
    var r = b[3] * W, x = b[1] * W, y = b[2] * H, rg = c.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, rgba(b[0], b[4])); rg.addColorStop(.55, rgba(b[0], b[4] * .33)); rg.addColorStop(1, rgba(b[0], 0));
    c.fillStyle = rg; c.fillRect(0, 0, W, H);
  });
  [['#1c3fc0', '#1590a8', .62, .82, .5], ['#2a2a90', '#2a70d8', .8, .97, .42]].forEach(function (rb, i) {
    var y0 = rb[2] * H, y1 = rb[3] * H, lg = c.createLinearGradient(0, 0, W, 0);
    lg.addColorStop(0, rgba(rb[0], rb[4])); lg.addColorStop(1, rgba(rb[1], rb[4]));
    c.fillStyle = lg; c.beginPath(); c.moveTo(0, y0 + 30);
    c.bezierCurveTo(W * .3, y0 - 70, W * .6, y0 + 90, W, y0 - 20 - i * 30); c.lineTo(W, y1);
    c.bezierCurveTo(W * .65, y1 + 40, W * .35, y1 - 60, 0, y1 + 10); c.closePath(); c.fill();
  });
})();

/* ════════════ 資料（示意） ════════════ */
var APPS = [
  { n: 'YouTube', bg: '#fff', fg: '#ff0033' }, { n: 'Netflix', bg: '#0b0b0b', fg: '#e50914' },
  { n: 'Disney+', bg: 'linear-gradient(135deg,#071a3d,#0f6f80)', fg: '#fff' }, { n: 'MyVideo', bg: '#ff6a00', fg: '#fff' },
  { n: 'KKTV', bg: '#161616', fg: '#ffcc00' }, { n: 'Spotify', bg: '#121212', fg: '#1ed760' },
  { n: '愛奇藝', bg: '#00be06', fg: '#fff' }, { n: 'LINE TV', bg: '#06c755', fg: '#fff' }, { n: 'Prime Video', bg: '#0f171e', fg: '#00a8e1' },
  { n: 'YouTube Music', bg: '#fff', fg: '#ff0033' }, { n: 'Twitch', bg: '#6441a5', fg: '#fff' }, { n: 'Plex', bg: '#1f1f1f', fg: '#e5a00d' },
  { n: 'Google Play', bg: '#fff', fg: '#01875f' }, { n: 'Media Player', bg: '#2a3348', fg: '#8fb8ff' }, { n: 'CX 檔案總管', bg: '#111', fg: '#4fc3f7' },
  { n: '設定', bg: '#3a3f4a', fg: '#ddd' }, { n: 'LINE', bg: '#06c755', fg: '#fff', phone: true }, { n: '相簿', bg: '#2b2b2b', fg: '#fff', phone: true }
];
var FAVS = [0, 1, 2, 3, 4];
var INPUTS = [
  { n: '電視', sub: '數位頻道', icon: 'tv' }, { n: 'HDMI 1', sub: 'PS5', icon: 'hdmi' }, { n: 'HDMI 2', sub: 'Apple TV', icon: 'hdmi' }, { n: 'HDMI 3', sub: '未連接', icon: 'hdmi' }
];
var CITIES = ['臺北市', '新北市', '基隆市', '桃園市', '新竹市', '新竹縣', '苗栗縣', '臺中市', '彰化縣', '南投縣', '雲林縣', '嘉義市', '嘉義縣', '臺南市', '高雄市', '屏東縣', '宜蘭縣', '花蓮縣', '臺東縣', '澎湖縣', '金門縣', '連江縣'];
var city = '新竹市';
var ICON = {
  tv: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8.5 21h7M12 17v4"/></svg>',
  hdmi: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h18v4l-3 3H6l-3-3z"/><path d="M8 12h8"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M2.5 12h2M19.5 12h2M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"><path d="M20.5 13.2A8.5 8.5 0 1 1 10.8 3.5a6.6 6.6 0 0 0 9.7 9.7z"/></svg>',
  cloud: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"><path d="M7 19h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.2 12 3.5 3.5 0 0 0 7 19z"/></svg>',
  rain: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"><path d="M7 15h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.2 8 3.5 3.5 0 0 0 7 15z"/><path d="M8.5 18l-1 2.8M12.5 18l-1 2.8M16.5 18l-1 2.8"/></svg>'
};

/* ════════════ 畫面組裝 ════════════ */
var $ = function (id) { return document.getElementById(id); };
function artHtml(a) { return '<div class="art" style="background:' + a.bg + ';color:' + a.fg + '">' + a.n + '</div><div class="sheen"></div>'; }

var dockItems = [];
function buildDock() {
  var dock = $('dock'); dock.innerHTML = ''; dockItems = [];
  FAVS.forEach(function (ai) {
    var t = document.createElement('div'); t.className = 'tile'; t.innerHTML = artHtml(APPS[ai]);
    dock.appendChild(t); dockItems.push({ el: t, kind: 'app', app: APPS[ai], idx: ai });
  });
}
var inputEls = [];
function buildInputs() {
  var box = $('inputs');
  INPUTS.forEach(function (inp) {
    var c = document.createElement('div'); c.className = 'chip glass' + (inp.sub === '未連接' ? ' off' : '');
    c.innerHTML = ICON[inp.icon] + '<span>' + inp.n + '</span>' + (inp.sub ? '<small>' + inp.sub + '</small>' : '');
    box.appendChild(c); inputEls.push({ el: c, input: inp });
  });
}
buildInputs();
var gridCells = [];
function buildGrid() {
  var grid = $('grid'); grid.innerHTML = ''; gridCells = [];
  APPS.forEach(function (a, i) {
    var c = document.createElement('div'); c.className = 'cell';
    c.innerHTML = '<div class="tile">' + artHtml(a) + (a.phone ? '<span class="badge">手機版</span>' : '') + '</div><div class="name">' + a.n + '</div>';
    grid.appendChild(c); gridCells.push({ el: c, app: a, idx: i });
  });
  $('appCount').textContent = APPS.length + ' 個';
}
buildDock(); buildGrid();

/* ════════════ 焦點狀態機 ════════════ */
var S = { layer: 'home', zone: 'dock', top: 0, inp: 0, dock: 0, grid: 0, sheet: null, sheetIdx: 0, sheetStack: [], cal: 8, calMonth: 11 };
var topEls = [$('today'), $('weather'), $('gear')];

function render() {
  topEls.forEach(function (el, i) { el.classList.toggle('focus', S.layer === 'home' && S.zone === 'top' && S.top === i); });
  dockItems.forEach(function (d, i) { d.el.classList.toggle('focus', S.layer === 'home' && S.zone === 'dock' && S.dock === i); });
  inputEls.forEach(function (d, i) { d.el.classList.toggle('focus', S.layer === 'home' && S.zone === 'inputs' && S.inp === i); });
  // 常用列：焦點超出畫面才捲動（不會每次都重新對齊）
  var cur = dockItems[S.dock].el, dock = $('dock');
  // dock 以 left:48 為原點，可視範圍 0～864
  var x = cur.offsetLeft + dockOffset, w = cur.offsetWidth;
  if (x + w > 864) dockOffset -= (x + w) - 864;
  if (x < 0) dockOffset -= x;
  dock.style.transform = 'translateX(' + dockOffset + 'px)';
  var label = $('focus-label');
  if (S.layer === 'home' && S.zone === 'dock') {
    var it = dockItems[S.dock];
    label.textContent = it.app.n;
    label.style.left = (48 + cur.offsetLeft + dockOffset + w / 2) + 'px'; label.style.opacity = 1;
  } else label.style.opacity = 0;
  $('drawer-hint').style.opacity = (S.layer === 'home' && S.zone === 'dock') ? 1 : 0;

  gridCells.forEach(function (c, i) { c.el.classList.toggle('focus', S.layer === 'drawer' && S.grid === i); c.el.querySelector('.tile').classList.toggle('focus', S.layer === 'drawer' && S.grid === i); });
  var row = Math.floor(S.grid / 6), rowH = 110;
  $('grid').style.transform = 'translateY(' + (-Math.max(0, row - 1) * rowH) + 'px)';

  document.body.classList.toggle('drawer-open', S.layer === 'drawer' || (S.layer === 'sheet' && S.sheetFrom === 'drawer'));
  document.body.classList.toggle('sheet-open', S.layer === 'sheet');
  document.body.classList.toggle('page-open', S.layer === 'calendar' || S.layer === 'weather');
  $('calendar').classList.toggle('show', S.layer === 'calendar');
  $('weatherPage').classList.toggle('show', S.layer === 'weather');
  if (S.layer === 'sheet') renderSheet();
  if (S.layer === 'calendar') renderCalendar();
}
var dockOffset = 0;

/* ── 側邊面板 ── */
function openSheet(spec) { if (S.layer !== 'sheet') { S.sheetFrom = S.layer; S.sheetStack = []; } else S.sheetStack.push({ spec: S.sheet, idx: S.sheetIdx }); S.sheet = spec; S.sheetIdx = spec.focus || 0; S.layer = 'sheet'; render(); }
function closeSheet() { if (S.sheetStack.length) { var p = S.sheetStack.pop(); S.sheet = p.spec; S.sheetIdx = p.idx; render(); return; } S.layer = S.sheetFrom || 'home'; render(); }
function closeAllSheets() { S.sheetStack = []; S.layer = S.sheetFrom || 'home'; render(); }
function renderSheet() {
  $('sheetTitle').textContent = S.sheet.title; $('sheetSub').textContent = S.sheet.sub || '';
  $('sheet-items').style.top = S.sheet.sub ? '104px' : '74px';
  var list = $('sheet-list'); list.innerHTML = '';
  S.sheet.items.forEach(function (it, i) {
    var d = document.createElement('div'); d.className = 'item' + (i === S.sheetIdx ? ' focus' : '');
    d.innerHTML = (it.sel ? '<span class="mark"></span>' : '') + '<span>' + it.label + '</span>' + (it.detail ? '<small>' + it.detail + '</small>' : '');
    list.appendChild(d);
  });
  var y = Math.max(0, S.sheetIdx - 6) * 51; list.style.transform = 'translateY(' + -y + 'px)';
}
function settingsSheet() {
  openSheet({ title: '設定', items: [
    { label: '地點', detail: city, go: citySheet },
    { label: '桌布', detail: '依時間自動', go: function () { toast('（原型）桌布配色選單'); } },
    { label: '顯示／隱藏 App', go: function () { toast('（原型）逐一切換顯示'); } },
    { label: '遙控器按鍵', detail: '改綁、防誤入原廠', go: function () { toast('（原型）按鍵對應'); } },
    { label: '系統設定', go: function () { toast('開啟系統設定'); } },
    { label: '網路', go: function () { toast('開啟網路設定'); } }
  ] });
}
function citySheet() {
  var idx = CITIES.indexOf(city);
  openSheet({ title: '地點', sub: '天氣用。只用縣市中心的大約位置，不讀取裝置定位。', focus: idx, items: CITIES.map(function (c) {
    return { label: c, sel: c === city, go: function () { city = c; $('wxCity').textContent = '晴・' + c; closeAllSheets(); toast('地點已改為 ' + c); } };
  }) });
}
function appOptions(app, inDock) {
  openSheet({ title: app.n, sub: app.phone ? '手機版 App：可能需要滑鼠或觸控操作' : null, items: [
    { label: '開啟', go: function () { closeAllSheets(); toast('開啟 ' + app.n); } },
    inDock ? { label: '移動位置', detail: '左右鍵移動', go: function () { closeAllSheets(); toast('（原型）進入移動模式'); } }
           : { label: '加入常用', go: function () { closeAllSheets(); toast('已加入常用'); } },
    inDock ? { label: '從常用移除', go: function () { closeAllSheets(); toast('已從常用移除'); } } : { label: '從主畫面隱藏', go: function () { closeAllSheets(); toast('已隱藏'); } },
    { label: '應用程式資訊', detail: '強制停止、清除快取', go: function () { closeAllSheets(); toast('開啟 App 資訊'); } },
    { label: '解除安裝', go: function () { closeAllSheets(); toast('開啟解除安裝'); } }
  ] });
}

/* ── 月曆（示意資料：11 月農曆） ── */
var LUNAR_NOV = ['廿三', '廿四', '廿五', '廿六', '廿七', '立冬', '廿九', '三十', '十月', '初二', '初三', '初四', '初五', '初六', '初七', '初八', '初九', '初十', '十一', '十二', '十三', '小雪', '下元節', '十六', '十七', '十八', '十九', '二十', '廿一', '廿二'];
var BAI_NOV = { 9: '初一', 23: '十五' };
function renderCalendar() {
  var el = $('calendar');
  var first = new Date(2026, 10, 1).getDay(), days = 30;
  var cells = '';
  for (var i = 0; i < first; i++) cells += '<div class="day empty"></div>';
  for (var d = 1; d <= days; d++) {
    var wd = (first + d - 1) % 7, l = LUNAR_NOV[d - 1];
    var special = l === '立冬' || l === '小雪' || l === '下元節' || l === '十月';
    cells += '<div class="day' + (wd === 0 || wd === 6 ? ' weekend' : '') + (d === 8 ? ' today' : '') + (special ? ' special' : '') + (BAI_NOV[d] ? ' bai' : '') + (d === S.cal ? ' focus' : '') + '"><div class="n">' + d + '</div><div class="l">' + l + '</div></div>';
  }
  var sel = S.cal, wdName = '日一二三四五六'.charAt((first + sel - 1) % 7);
  var lunarFull = sel <= 8 ? '九月' + (sel === 8 ? '三十' : LUNAR_NOV[sel - 1].replace('立冬', '廿八')) : '十月' + (sel === 9 ? '初一' : LUNAR_NOV[sel - 1].replace('小雪', '十四').replace('下元節', '十五'));
  var tags = (sel === 8 ? '<span class="tag">今天</span>' : '') + (BAI_NOV[sel] ? '<span class="tag">' + BAI_NOV[sel] + '拜拜</span>' : '') + (sel === 7 ? '<span class="tag">立冬</span>' : '') + (sel === 22 ? '<span class="tag">小雪</span>' : '') + (sel === 23 ? '<span class="tag">下元節</span>' : '');
  el.innerHTML =
    '<div><div class="cal-head"><h1>2026年11月</h1><span>農曆九月廿三 － 十月廿二・丙午馬年</span><span class="nav">頻道鍵換月</span></div>' +
    '<div class="weekdays">' + '日一二三四五六'.split('').map(function (w) { return '<div>' + w + '</div>'; }).join('') + '</div>' +
    '<div class="days">' + cells + '</div></div>' +
    '<div class="detail"><div class="big">' + sel + '</div><div class="sub">2026年11月 星期' + wdName + '</div>' +
    '<h2>農曆' + lunarFull + '</h2><div class="sub" style="color:var(--ink3)">丙午年・生肖馬</div><div class="tags">' + tags + '</div>' +
    '<dl><dt>宜</dt><dd>祭祀　祈福　出行　安床　開池　補垣</dd><dt>忌</dt><dd>入宅　移徙　嫁娶　掘井　作灶</dd><dt>沖煞</dt><dd>沖鼠　煞北</dd><dt>下個節氣</dt><dd>小雪　11月22日</dd></dl></div>' +
    '<div class="back">Esc 返回</div>';
}

/* ── 天氣頁 ── */
(function buildWeather() {
  var hours = [['現在', 'moon', 23], ['22時', 'moon', 22], ['1時', 'cloud', 21], ['4時', 'cloud', 21], ['7時', 'sun', 22], ['10時', 'sun', 26], ['13時', 'sun', 28], ['16時', 'cloud', 26]];
  var days = [['今天', 'sun', 0, 21, 28], ['一', 'cloud', 10, 20, 24], ['二', 'rain', 60, 19, 21], ['三', 'rain', 40, 18, 22], ['四', 'cloud', 10, 19, 23], ['五', 'sun', 0, 20, 26], ['六', 'sun', 0, 21, 27]];
  var lo = 18, hi = 28;
  $('weatherPage').innerHTML =
    '<div class="city" id="wxPageCity">新竹市</div>' +
    '<div class="now">' + ICON.moon + '<div class="t">23°</div><div><div class="d">晴</div><div class="r">最高 28°　最低 21°</div></div></div>' +
    '<div class="stats"><div><small>體感</small>24°</div><div><small>濕度</small>68%</div><div><small>風速</small>9 km/h</div><div><small>降雨機率</small>0%</div><div><small>日出</small>06:09</div><div><small>日落</small>17:08</div></div>' +
    '<div class="hours">' + hours.map(function (h) { return '<div><small>' + h[0] + '</small>' + ICON[h[1]] + h[2] + '°</div>'; }).join('') + '</div>' +
    '<div class="week"><h3>7 日預報</h3>' + days.map(function (d) {
      var l = (d[3] - lo) / (hi - lo) * 100, r = (d[4] - lo) / (hi - lo) * 100;
      return '<div class="wrow"><span>' + d[0] + '</span>' + ICON[d[1]] + '<span class="pop">' + (d[2] >= 20 ? d[2] + '%' : '') + '</span><span class="lo">' + d[3] + '°</span><div class="bar"><i style="left:' + l + '%;right:' + (100 - r) + '%"></i></div><span>' + d[4] + '°</span></div>';
    }).join('') + '</div><div class="back">Esc 返回</div>';
})();

/* ── 提示 ── */
var toastTimer;
function toast(msg) { var t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1600); }

/* ════════════ 按鍵 ════════════ */
function activate(long) {
  if (S.layer === 'home' && S.zone === 'top') {
    if (S.top === 0) { S.layer = 'calendar'; S.cal = 8; render(); }
    else if (S.top === 1) { $('wxPageCity').textContent = city; S.layer = 'weather'; render(); }
    else settingsSheet();
  } else if (S.layer === 'home' && S.zone === 'inputs') {
    var inp = inputEls[S.inp].input;
    toast(inp.sub === '未連接' ? inp.n + ' 沒有連接裝置' : '切換到 ' + inp.n + (inp.sub ? '（' + inp.sub + '）' : ''));
  } else if (S.layer === 'home' && S.zone === 'dock') {
    var it = dockItems[S.dock];
    if (long) appOptions(it.app, true); else toast('開啟 ' + it.app.n);
  } else if (S.layer === 'drawer') {
    var c = gridCells[S.grid]; if (long) appOptions(c.app, FAVS.indexOf(c.idx) >= 0); else toast('開啟 ' + c.app.n);
  } else if (S.layer === 'sheet') {
    S.sheet.items[S.sheetIdx].go();
  } else if (S.layer === 'calendar') {
    toast('11月' + S.cal + '日');
  }
}
function back() {
  if (S.layer === 'sheet') closeSheet();
  else if (S.layer === 'drawer' || S.layer === 'calendar' || S.layer === 'weather') { S.layer = 'home'; render(); }
  else if (S.layer === 'home' && S.zone !== 'dock') { S.zone = 'dock'; render(); }
}
function move(dx, dy) {
  if (S.layer === 'home') {
    if (S.zone === 'top') {
      if (dx) S.top = Math.max(0, Math.min(2, S.top + dx));
      if (dy > 0) S.zone = 'inputs';
    } else if (S.zone === 'inputs') {
      if (dx) S.inp = Math.max(0, Math.min(inputEls.length - 1, S.inp + dx));
      if (dy < 0) { S.zone = 'top'; S.top = 0; }
      if (dy > 0) S.zone = 'dock';
    } else {
      if (dx) S.dock = Math.max(0, Math.min(dockItems.length - 1, S.dock + dx));
      if (dy < 0) S.zone = 'inputs';
      if (dy > 0) { S.layer = 'drawer'; }
    }
  } else if (S.layer === 'drawer') {
    var n = gridCells.length, col = S.grid % 6;
    if (dx) { var nx = S.grid + dx; if (Math.floor(nx / 6) === Math.floor(S.grid / 6) && nx >= 0 && nx < n) S.grid = nx; }
    if (dy > 0 && S.grid + 6 < n) S.grid += 6;
    else if (dy > 0 && Math.floor(S.grid / 6) < Math.floor((n - 1) / 6)) S.grid = n - 1;
    if (dy < 0) { if (S.grid < 6) S.layer = 'home'; else S.grid -= 6; }
  } else if (S.layer === 'sheet') {
    if (dy) S.sheetIdx = Math.max(0, Math.min(S.sheet.items.length - 1, S.sheetIdx + dy));
    if (dx < 0) closeSheet();
  } else if (S.layer === 'calendar') {
    S.cal = Math.max(1, Math.min(30, S.cal + dx + dy * 7));
  }
  render();
}

var holdTimer = null, longFired = false;
addEventListener('keydown', function (e) {
  var k = e.key;
  if (k === 'ArrowLeft') move(-1, 0);
  else if (k === 'ArrowRight') move(1, 0);
  else if (k === 'ArrowUp') move(0, -1);
  else if (k === 'ArrowDown') move(0, 1);
  else if (k === 'Escape' || k === 'Backspace') back();
  else if (k === 'Enter') {
    if (!e.repeat) { longFired = false; holdTimer = setTimeout(function () { longFired = true; activate(true); }, 500); }
  } else return;
  e.preventDefault();
});
addEventListener('keyup', function (e) {
  if (e.key === 'Enter') { clearTimeout(holdTimer); if (!longFired) activate(false); }
});

function fit() { var s = Math.min(innerWidth / 960, (innerHeight - 24) / 540); $('stage').style.transform = 'scale(' + s + ')'; }
addEventListener('resize', fit); fit();
render();
</script>
</body>
</html>
