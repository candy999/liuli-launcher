<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>海浪</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #061226; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="liuli.js"></script>
<script>
/*
 * 海浪：多層正弦波疊出海面，天空與海色跟著時間走，太陽或月亮在海面留下倒影。
 * 風速（wind）與天氣（rain/thunder）會讓浪變大、顏色變暗；滿月前後（moon≈0.5）月光倒影最亮。
 */
(function () {
  var canvas = document.getElementById('c');
  var g = canvas.getContext('2d');
  var C = Liuli.ctx, W = 0, H = 0, scale = 0.5;

  function resize() {
    scale = C.motion === 'reduce' ? 0.35 : 0.5;
    W = canvas.width = Math.max(1, Math.round(innerWidth * scale));
    H = canvas.height = Math.max(1, Math.round(innerHeight * scale));
  }

  function palette() {
    var stormy = C.isRainy;
    if (C.daylight) {
      var dusk = C.sun > 0.85 || (C.sun >= 0 && C.sun < 0.1);
      if (dusk) return { skyTop: '#3b3a78', skyBot: '#ff9a6b', sea: [32, 58, 110], glow: 'rgba(255,170,110,' };
      return {
        skyTop: stormy ? '#6b7788' : '#4f9fe8', skyBot: stormy ? '#a9b2bd' : '#cfe8ff',
        sea: stormy ? [52, 72, 88] : [20, 104, 160], glow: 'rgba(255,250,225,'
      };
    }
    return { skyTop: '#040816', skyBot: stormy ? '#1a2030' : '#14204a', sea: [8, 22, 48], glow: 'rgba(230,236,255,' };
  }

  var last = 0;
  function frame(t) {
    requestAnimationFrame(frame);
    if (t - last < 1000 / Liuli.fps() - 2) return;
    last = t;
    var p = palette();
    var horizon = H * 0.48;
    var sky = g.createLinearGradient(0, 0, 0, horizon);
    sky.addColorStop(0, p.skyTop); sky.addColorStop(1, p.skyBot);
    g.fillStyle = sky; g.fillRect(0, 0, W, horizon + 1);

    var moon = isNaN(C.moon) ? 0.5 : C.moon;
    var bodyX = W * (C.daylight && C.sun >= 0 ? 0.15 + 0.7 * C.sun : 0.7);
    var bodyY = horizon - H * (C.daylight ? 0.28 * Math.sin(Math.PI * Math.max(0, C.sun)) + 0.04 : 0.26);
    var brightness = C.daylight ? (C.isRainy ? 0.2 : 0.9) : 0.25 + 0.6 * (1 - Math.abs(moon - 0.5) * 2);
    var halo = g.createRadialGradient(bodyX, bodyY, 0, bodyX, bodyY, H * 0.3);
    halo.addColorStop(0, p.glow + brightness + ')');
    halo.addColorStop(0.06, p.glow + brightness * 0.7 + ')');
    halo.addColorStop(1, p.glow + '0)');
    g.fillStyle = halo; g.fillRect(0, 0, W, horizon);

    var amp = 1 + Math.min(2.5, (C.wind || 5) / 12) + (C.isRainy ? 1 : 0);
    var layers = C.motion === 'reduce' ? 5 : 9;
    for (var i = 0; i < layers; i++) {
      var k = i / (layers - 1);
      var y0 = horizon + (H - horizon) * Math.pow(k, 1.6);
      var a = amp * (1.5 + k * 9) * scale;
      var len = 0.004 / (0.4 + k) / scale;
      var speed = 0.0006 + k * 0.0009;
      var shade = 0.55 + 0.45 * k;
      g.fillStyle = 'rgb(' + (p.sea[0] * shade | 0) + ',' + (p.sea[1] * shade | 0) + ',' + (p.sea[2] * shade | 0) + ')';
      g.beginPath();
      g.moveTo(0, H);
      for (var x = 0; x <= W; x += 4) {
        var y = y0 + Math.sin(x * len + t * speed + i * 1.3) * a + Math.sin(x * len * 2.3 - t * speed * 1.4 + i) * a * 0.35;
        g.lineTo(x, y);
      }
      g.lineTo(W, H);
      g.closePath();
      g.fill();
    }
    // 海面上的光帶倒影
    g.globalCompositeOperation = 'lighter';
    for (var j = 0; j < 40; j++) {
      var yy = horizon + (H - horizon) * (j / 40);
      var wob = Math.sin(t * 0.002 + j * 1.7) * 10 * scale * (1 + j / 20);
      var wd = (6 + j * 1.6) * scale * (0.6 + 0.4 * Math.sin(t * 0.003 + j));
      g.fillStyle = p.glow + (brightness * 0.35 * (1 - j / 45)).toFixed(3) + ')';
      g.fillRect(bodyX + wob - wd / 2, yy, wd, 1.4 * scale * 2);
    }
    g.globalCompositeOperation = 'source-over';
  }

  Liuli.onChange(function (c) { C = c; });
  addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
